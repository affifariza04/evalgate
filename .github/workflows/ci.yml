name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  # The gate itself, dogfooded on the example: v2 must be blocked, v3 must pass.
  demo-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run the three prompt versions
        working-directory: examples/support-bot
        run: for v in v1 v2 v3; do uv run evalgate run suite.yaml -o ../../site/run-$v.json --label $v --system prompts/$v.md; done
      - name: v1 -> v2 must FAIL the gate
        working-directory: examples/support-bot
        run: "! uv run evalgate compare suite.yaml ../../site/run-v1.json ../../site/run-v2.json --html ../../site/v1-vs-v2.html"
      - name: v2 -> v3 must PASS the gate
        working-directory: examples/support-bot
        run: uv run evalgate compare suite.yaml ../../site/run-v2.json ../../site/run-v3.json --html ../../site/v2-vs-v3.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, demo-gate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
